services:
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./api:/app
      - iskele-data:/app/data
    command: >
      sh -c "pip install -r requirements.txt &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      ISKELE_JWT_SECRET: ${ISKELE_JWT_SECRET:-change-me-in-production}
      ISKELE_ADMIN_USERNAME: ${ISKELE_ADMIN_USERNAME:-admin}
      ISKELE_ADMIN_PASSWORD: ${ISKELE_ADMIN_PASSWORD:-admin}
      ISKELE_ADMIN_DISPLAY_NAME: ${ISKELE_ADMIN_DISPLAY_NAME:-Admin}
      ISKELE_DATABASE_PATH: /app/data/iskele.db
      ISKELE_DOCKER_HOST: localhost
      ISKELE_SEED_TESTER: "true"
    # Mount docker.sock later when real jobs are wired:
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock

volumes:
  iskele-data:
